<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img"><style>.hop{transform-box:fill-box;transform-origin:50% 88%;animation:hop 1.7s ease-in-out 0.48s infinite;}.lid{transform-box:fill-box;transform-origin:center;animation:blink 3.5s ease-in-out 0.6799999999999999s infinite;}@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}@keyframes blink{0%,86%,100%{transform:scaleY(0.05)}93%{transform:scaleY(1)}}@media (prefers-reduced-motion:reduce){.hop,.lid{animation:none}.lid{opacity:0}}</style><g class="hop"><rect width="200" height="220" fill="#c6e7a4"/><path d="M20 180 Q10 80 30 170" fill="none" stroke="#2e9b5b" stroke-width="8" stroke-linecap="round"/><path d="M42 180 Q32 80 52 170" fill="none" stroke="#7dce6a" stroke-width="8" stroke-linecap="round"/><path d="M64 180 Q54 80 74 170" fill="none" stroke="#2e9b5b" stroke-width="8" stroke-linecap="round"/><path d="M86 180 Q76 80 96 170" fill="none" stroke="#7dce6a" stroke-width="8" stroke-linecap="round"/><path d="M108 180 Q98 80 118 170" fill="none" stroke="#2e9b5b" stroke-width="8" stroke-linecap="round"/><path d="M130 180 Q120 80 140 170" fill="none" stroke="#7dce6a" stroke-width="8" stroke-linecap="round"/><path d="M152 180 Q142 80 162 170" fill="none" stroke="#2e9b5b" stroke-width="8" stroke-linecap="round"/><path d="M174 180 Q164 80 184 170" fill="none" stroke="#7dce6a" stroke-width="8" stroke-linecap="round"/></g></svg>