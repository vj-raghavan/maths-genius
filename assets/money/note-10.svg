<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img"><style>.hop{transform-box:fill-box;transform-origin:50% 88%;animation:hop 1.7s ease-in-out 0.0s infinite;}.lid{transform-box:fill-box;transform-origin:center;animation:blink 3.5s ease-in-out 0.2s infinite;}@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}@keyframes blink{0%,86%,100%{transform:scaleY(0.05)}93%{transform:scaleY(1)}}@media (prefers-reduced-motion:reduce){.hop,.lid{animation:none}.lid{opacity:0}}</style><g class="hop"><rect x="18" y="48" width="164" height="124" rx="16" fill="#f4b4c8" stroke="#243044" stroke-width="4"/><text x="100" y="128" text-anchor="middle" font-family="Nunito, sans-serif" font-size="42" font-weight="800" fill="#243044">$10</text><ellipse cx="52" cy="86" rx="7" ry="9" fill="#fff" stroke="#243044" stroke-width="3"/><circle cx="53" cy="87" r="5.5" fill="#243044"/><circle cx="55" cy="84" r="2" fill="#fff"/><ellipse class="lid" cx="52" cy="86" rx="7" ry="9" fill="#f4b4c8"/><ellipse cx="76" cy="86" rx="7" ry="9" fill="#fff" stroke="#243044" stroke-width="3"/><circle cx="77" cy="87" r="5.5" fill="#243044"/><circle cx="79" cy="84" r="2" fill="#fff"/><ellipse class="lid" cx="76" cy="86" rx="7" ry="9" fill="#f4b4c8"/></g></svg>