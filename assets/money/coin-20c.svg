<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img"><style>.hop{transform-box:fill-box;transform-origin:50% 88%;animation:hop 1.7s ease-in-out 0.96s infinite;}.lid{transform-box:fill-box;transform-origin:center;animation:blink 3.5s ease-in-out 1.16s infinite;}@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}@keyframes blink{0%,86%,100%{transform:scaleY(0.05)}93%{transform:scaleY(1)}}@media (prefers-reduced-motion:reduce){.hop,.lid{animation:none}.lid{opacity:0}}</style><g class="hop"><ellipse cx="100" cy="196" rx="40" ry="8" fill="#000" opacity="0.08"/><circle cx="100" cy="108" r="72" fill="#d7dde6" stroke="#243044" stroke-width="6"/><circle cx="100" cy="108" r="58" fill="none" stroke="#fff" stroke-width="4" opacity="0.7"/><text x="100" y="128" text-anchor="middle" font-family="Nunito, sans-serif" font-size="36" font-weight="800" fill="#243044">20c</text><ellipse cx="82" cy="92" rx="8" ry="10" fill="#fff" stroke="#243044" stroke-width="3"/><circle cx="83" cy="93" r="5.5" fill="#243044"/><circle cx="85" cy="90" r="2" fill="#fff"/><ellipse class="lid" cx="82" cy="92" rx="8" ry="10" fill="#d7dde6"/><ellipse cx="118" cy="92" rx="8" ry="10" fill="#fff" stroke="#243044" stroke-width="3"/><circle cx="119" cy="93" r="5.5" fill="#243044"/><circle cx="121" cy="90" r="2" fill="#fff"/><ellipse class="lid" cx="118" cy="92" rx="8" ry="10" fill="#d7dde6"/></g></svg>