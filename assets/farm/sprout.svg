<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img"><style>.hop{transform-box:fill-box;transform-origin:50% 88%;animation:hop 1.7s ease-in-out 0.12s infinite;}.lid{transform-box:fill-box;transform-origin:center;animation:blink 3.5s ease-in-out 0.32s infinite;}@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}@keyframes blink{0%,86%,100%{transform:scaleY(0.05)}93%{transform:scaleY(1)}}@media (prefers-reduced-motion:reduce){.hop,.lid{animation:none}.lid{opacity:0}}</style><g class="hop"><ellipse cx="100" cy="196" rx="40" ry="8" fill="#000" opacity="0.08"/><path d="M100 170 V90" stroke="#2e9b5b" stroke-width="6" stroke-linecap="round"/><ellipse cx="78" cy="96" rx="24" ry="14" fill="#7dce6a" stroke="#243044" stroke-width="3"/><ellipse cx="122" cy="90" rx="24" ry="14" fill="#2e9b5b" stroke="#243044" stroke-width="3"/></g></svg>