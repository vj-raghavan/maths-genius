<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img"><style>.hop{transform-box:fill-box;transform-origin:50% 88%;animation:hop 1.7s ease-in-out 0.24s infinite;}.lid{transform-box:fill-box;transform-origin:center;animation:blink 3.5s ease-in-out 0.44s infinite;}@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}@keyframes blink{0%,86%,100%{transform:scaleY(0.05)}93%{transform:scaleY(1)}}@media (prefers-reduced-motion:reduce){.hop,.lid{animation:none}.lid{opacity:0}}</style><g class="hop"><ellipse cx="100" cy="130" rx="70" ry="40" fill="#2e9b5b" stroke="#243044" stroke-width="4"/><ellipse cx="100" cy="124" rx="36" ry="18" fill="#c4a46a"/><circle cx="46" cy="120" r="16" fill="#7dce6a" stroke="#243044" stroke-width="3"/><ellipse cx="40" cy="118" rx="4" ry="6" fill="#fff" stroke="#243044" stroke-width="3"/><circle cx="41" cy="119" r="5.5" fill="#243044"/><circle cx="43" cy="116" r="2" fill="#fff"/><ellipse class="lid" cx="40" cy="118" rx="4" ry="6" fill="#7dce6a"/><ellipse cx="52" cy="118" rx="4" ry="6" fill="#fff" stroke="#243044" stroke-width="3"/><circle cx="53" cy="119" r="5.5" fill="#243044"/><circle cx="55" cy="116" r="2" fill="#fff"/><ellipse class="lid" cx="52" cy="118" rx="4" ry="6" fill="#7dce6a"/></g></svg>