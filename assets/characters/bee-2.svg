<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img"><style>.hop{transform-box:fill-box;transform-origin:50% 88%;animation:hop 1.7s ease-in-out 0.96s infinite;}.lid{transform-box:fill-box;transform-origin:center;animation:blink 3.5s ease-in-out 1.16s infinite;}@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}@keyframes blink{0%,86%,100%{transform:scaleY(0.05)}93%{transform:scaleY(1)}}@media (prefers-reduced-motion:reduce){.hop,.lid{animation:none}.lid{opacity:0}}</style><g class="hop"><ellipse cx="100" cy="120" rx="36" ry="28" fill="#f0b429" stroke="#243044" stroke-width="4"/><path d="M80 110 H120 M80 124 H120 M80 138 H120" stroke="#243044" stroke-width="4"/><ellipse cx="70" cy="100" rx="16" ry="10" fill="#d7eef8"/><ellipse cx="130" cy="100" rx="16" ry="10" fill="#d7eef8"/><ellipse cx="88" cy="112" rx="6" ry="8" fill="#fff" stroke="#243044" stroke-width="3"/><circle cx="89" cy="113" r="5.5" fill="#243044"/><circle cx="91" cy="110" r="2" fill="#fff"/><ellipse class="lid" cx="88" cy="112" rx="6" ry="8" fill="#f0b429"/><ellipse cx="112" cy="112" rx="6" ry="8" fill="#fff" stroke="#243044" stroke-width="3"/><circle cx="113" cy="113" r="5.5" fill="#243044"/><circle cx="115" cy="110" r="2" fill="#fff"/><ellipse class="lid" cx="112" cy="112" rx="6" ry="8" fill="#f0b429"/></g></svg>