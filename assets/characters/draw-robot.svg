<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img"><style>.hop{transform-box:fill-box;transform-origin:50% 88%;animation:hop 1.7s ease-in-out 0.96s infinite;}.lid{transform-box:fill-box;transform-origin:center;animation:blink 3.5s ease-in-out 1.16s infinite;}@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}@keyframes blink{0%,86%,100%{transform:scaleY(0.05)}93%{transform:scaleY(1)}}@media (prefers-reduced-motion:reduce){.hop,.lid{animation:none}.lid{opacity:0}}</style><g class="hop"><rect x="48" y="64" width="104" height="90" rx="16" fill="#d7eef8" stroke="#243044" stroke-width="4"/><rect x="92" y="40" width="16" height="24" fill="#7d5cc6"/><circle cx="100" cy="34" r="10" fill="#f0b429" stroke="#243044" stroke-width="3"/><ellipse cx="76" cy="100" rx="12" ry="14" fill="#fff" stroke="#243044" stroke-width="3"/><circle cx="77" cy="101" r="5.5" fill="#243044"/><circle cx="79" cy="98" r="2" fill="#fff"/><ellipse class="lid" cx="76" cy="100" rx="12" ry="14" fill="#d7eef8"/><ellipse cx="124" cy="100" rx="12" ry="14" fill="#fff" stroke="#243044" stroke-width="3"/><circle cx="125" cy="101" r="5.5" fill="#243044"/><circle cx="127" cy="98" r="2" fill="#fff"/><ellipse class="lid" cx="124" cy="100" rx="12" ry="14" fill="#d7eef8"/><rect x="78" y="128" width="44" height="8" rx="4" fill="#243044"/></g></svg>