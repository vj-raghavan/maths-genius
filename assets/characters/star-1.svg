<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="Cheering star">
  <style>
    .hop { transform-box: fill-box; transform-origin: 50% 88%; animation: hop 0.7s ease-in-out infinite; }
    .lid { transform-box: fill-box; transform-origin: center; animation: blink 2.4s ease-in-out infinite; }
    @keyframes hop { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-16px) rotate(4deg); } }
    @keyframes blink { 0%, 86%, 100% { transform: scaleY(0.05); } 93% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .hop, .lid { animation: none; } .lid { opacity: 0; } }
  </style>
  <g class="hop">
    <ellipse cx="100" cy="198" rx="46" ry="8" fill="#000" opacity="0.08"/>
    <path d="M100 28 L122 78 L176 84 L136 120 L148 174 L100 146 L52 174 L64 120 L24 84 L78 78 Z" fill="#f0b429" stroke="#243044" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="78" cy="104" rx="10" ry="12" fill="#fff" stroke="#243044" stroke-width="3"/>
    <circle cx="79" cy="105" r="5" fill="#243044"/>
    <circle cx="81" cy="102" r="2" fill="#fff"/>
    <ellipse class="lid" cx="78" cy="104" rx="10" ry="12" fill="#f0b429"/>
    <ellipse cx="122" cy="104" rx="10" ry="12" fill="#fff" stroke="#243044" stroke-width="3"/>
    <circle cx="123" cy="105" r="5" fill="#243044"/>
    <circle cx="125" cy="102" r="2" fill="#fff"/>
    <ellipse class="lid" cx="122" cy="104" rx="10" ry="12" fill="#f0b429"/>
    <path d="M86 124 Q100 138 114 124" fill="none" stroke="#243044" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
