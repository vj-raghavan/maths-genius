<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img"><style>.hop{transform-box:fill-box;transform-origin:50% 88%;animation:hop 1.7s ease-in-out 0.12s infinite;}.lid{transform-box:fill-box;transform-origin:center;animation:blink 3.5s ease-in-out 0.32s infinite;}@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}@keyframes blink{0%,86%,100%{transform:scaleY(0.05)}93%{transform:scaleY(1)}}@media (prefers-reduced-motion:reduce){.hop,.lid{animation:none}.lid{opacity:0}}</style><g class="hop"><circle cx="100" cy="150" r="40" fill="#f4f1ea" stroke="#243044" stroke-width="4"/><circle cx="100" cy="92" r="28" fill="#f4f1ea" stroke="#243044" stroke-width="4"/><ellipse cx="90" cy="88" rx="5" ry="7" fill="#fff" stroke="#243044" stroke-width="3"/><circle cx="91" cy="89" r="5.5" fill="#243044"/><circle cx="93" cy="86" r="2" fill="#fff"/><ellipse class="lid" cx="90" cy="88" rx="5" ry="7" fill="#f4f1ea"/><ellipse cx="110" cy="88" rx="5" ry="7" fill="#fff" stroke="#243044" stroke-width="3"/><circle cx="111" cy="89" r="5.5" fill="#243044"/><circle cx="113" cy="86" r="2" fill="#fff"/><ellipse class="lid" cx="110" cy="88" rx="5" ry="7" fill="#f4f1ea"/><path d="M70 70 H130" stroke="#e15d3a" stroke-width="6"/></g></svg>