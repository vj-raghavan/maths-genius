<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img"><style>.hop{transform-box:fill-box;transform-origin:50% 88%;animation:hop 1.7s ease-in-out 0.36s infinite;}.lid{transform-box:fill-box;transform-origin:center;animation:blink 3.5s ease-in-out 0.56s infinite;}@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}@keyframes blink{0%,86%,100%{transform:scaleY(0.05)}93%{transform:scaleY(1)}}@media (prefers-reduced-motion:reduce){.hop,.lid{animation:none}.lid{opacity:0}}</style><g class="hop"><ellipse cx="100" cy="124" rx="78" ry="40" fill="#2f7dd1" stroke="#243044" stroke-width="4"/><ellipse cx="70" cy="116" rx="8" ry="10" fill="#fff" stroke="#243044" stroke-width="3"/><circle cx="71" cy="117" r="5.5" fill="#243044"/><circle cx="73" cy="114" r="2" fill="#fff"/><ellipse class="lid" cx="70" cy="116" rx="8" ry="10" fill="#2f7dd1"/><ellipse cx="70" cy="116" rx="8" ry="10" fill="#fff" stroke="#243044" stroke-width="3"/><circle cx="71" cy="117" r="5.5" fill="#243044"/><circle cx="73" cy="114" r="2" fill="#fff"/><ellipse class="lid" cx="70" cy="116" rx="8" ry="10" fill="#2f7dd1"/><path d="M150 90 L168 60" stroke="#d7eef8" stroke-width="6"/></g></svg>