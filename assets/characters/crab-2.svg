<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img"><style>.hop{transform-box:fill-box;transform-origin:50% 88%;animation:hop 1.7s ease-in-out 0.96s infinite;}.lid{transform-box:fill-box;transform-origin:center;animation:blink 3.5s ease-in-out 1.16s infinite;}@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}@keyframes blink{0%,86%,100%{transform:scaleY(0.05)}93%{transform:scaleY(1)}}@media (prefers-reduced-motion:reduce){.hop,.lid{animation:none}.lid{opacity:0}}</style><g class="hop"><ellipse cx="100" cy="124" rx="50" ry="32" fill="#e15d3a" stroke="#243044" stroke-width="4"/><path d="M40 110 L16 86 M160 110 L184 86" stroke="#e15d3a" stroke-width="8" stroke-linecap="round"/><ellipse cx="84" cy="100" rx="7" ry="9" fill="#fff" stroke="#243044" stroke-width="3"/><circle cx="85" cy="101" r="5.5" fill="#243044"/><circle cx="87" cy="98" r="2" fill="#fff"/><ellipse class="lid" cx="84" cy="100" rx="7" ry="9" fill="#e15d3a"/><ellipse cx="116" cy="100" rx="7" ry="9" fill="#fff" stroke="#243044" stroke-width="3"/><circle cx="117" cy="101" r="5.5" fill="#243044"/><circle cx="119" cy="98" r="2" fill="#fff"/><ellipse class="lid" cx="116" cy="100" rx="7" ry="9" fill="#e15d3a"/></g></svg>