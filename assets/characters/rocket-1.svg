<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img"><style>.hop{transform-box:fill-box;transform-origin:50% 88%;animation:hop 1.7s ease-in-out 0.48s infinite;}.lid{transform-box:fill-box;transform-origin:center;animation:blink 3.5s ease-in-out 0.6799999999999999s infinite;}@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}@keyframes blink{0%,86%,100%{transform:scaleY(0.05)}93%{transform:scaleY(1)}}@media (prefers-reduced-motion:reduce){.hop,.lid{animation:none}.lid{opacity:0}}</style><g class="hop"><path d="M100 28 C140 70 140 130 100 180 C60 130 60 70 100 28 Z" fill="#e15d3a" stroke="#243044" stroke-width="4"/><circle cx="100" cy="96" r="18" fill="#d7eef8" stroke="#243044" stroke-width="3"/><path d="M70 150 L40 186 H78 Z" fill="#f08a24"/><path d="M130 150 L160 186 H122 Z" fill="#f08a24"/></g></svg>