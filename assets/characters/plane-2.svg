<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img"><style>.hop{transform-box:fill-box;transform-origin:50% 88%;animation:hop 1.7s ease-in-out 0.24s infinite;}.lid{transform-box:fill-box;transform-origin:center;animation:blink 3.5s ease-in-out 0.44s infinite;}@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}@keyframes blink{0%,86%,100%{transform:scaleY(0.05)}93%{transform:scaleY(1)}}@media (prefers-reduced-motion:reduce){.hop,.lid{animation:none}.lid{opacity:0}}</style><g class="hop"><ellipse cx="100" cy="186" rx="60" ry="10" fill="#000" opacity="0.08"/><rect x="36" y="108" width="128" height="28" rx="14" fill="#7d5cc6" stroke="#243044" stroke-width="4"/><path d="M70 108 L40 78 H78 Z" fill="#7d5cc6" stroke="#243044" stroke-width="3"/><path d="M150 112 L184 100 V128 Z" fill="#7d5cc6" stroke="#243044" stroke-width="3"/><ellipse cx="102" cy="112" rx="9" ry="11" fill="#fff" stroke="#243044" stroke-width="3"/><circle cx="103" cy="113" r="5.5" fill="#243044"/><circle cx="105" cy="110" r="2" fill="#fff"/><ellipse class="lid" cx="102" cy="112" rx="9" ry="11" fill="#7d5cc6"/><ellipse cx="134" cy="112" rx="9" ry="11" fill="#fff" stroke="#243044" stroke-width="3"/><circle cx="135" cy="113" r="5.5" fill="#243044"/><circle cx="137" cy="110" r="2" fill="#fff"/><ellipse class="lid" cx="134" cy="112" rx="9" ry="11" fill="#7d5cc6"/><path d="M102 128 Q118 142 134 128" fill="none" stroke="#243044" stroke-width="3" stroke-linecap="round"/></g></svg>