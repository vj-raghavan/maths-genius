<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img"><style>.hop{transform-box:fill-box;transform-origin:50% 88%;animation:hop 1.7s ease-in-out 0.96s infinite;}.lid{transform-box:fill-box;transform-origin:center;animation:blink 3.5s ease-in-out 1.16s infinite;}@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}@keyframes blink{0%,86%,100%{transform:scaleY(0.05)}93%{transform:scaleY(1)}}@media (prefers-reduced-motion:reduce){.hop,.lid{animation:none}.lid{opacity:0}}</style><g class="hop"><ellipse cx="62" cy="110" rx="36" ry="28" fill="#f4b4c8" stroke="#243044" stroke-width="3"/><ellipse cx="138" cy="110" rx="36" ry="28" fill="#7d5cc6" stroke="#243044" stroke-width="3"/><rect x="94" y="84" width="12" height="60" rx="6" fill="#243044"/><ellipse cx="92" cy="90" rx="4" ry="6" fill="#fff" stroke="#243044" stroke-width="3"/><circle cx="93" cy="91" r="5.5" fill="#243044"/><circle cx="95" cy="88" r="2" fill="#fff"/><ellipse class="lid" cx="92" cy="90" rx="4" ry="6" fill="#243044"/><ellipse cx="108" cy="90" rx="4" ry="6" fill="#fff" stroke="#243044" stroke-width="3"/><circle cx="109" cy="91" r="5.5" fill="#243044"/><circle cx="111" cy="88" r="2" fill="#fff"/><ellipse class="lid" cx="108" cy="90" rx="4" ry="6" fill="#243044"/></g></svg>